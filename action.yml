name: PR diff stats
description: Keep one PR diff comment, using Markdown by default or an optional illustrated image.
author: MilkStraw

branding:
  icon: bar-chart-2
  color: green

inputs:
  config:
    description: Optional path to a JSON group configuration in the PR base commit.
    required: false
    default: ""
  format:
    description: Report format, markdown or image.
    required: false
    default: markdown
  image-token:
    description: PAT with Contents read and write access to the consumer repository. Required for image format.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Update diff comment
      uses: actions/github-script@v9
      env:
        PR_DIFF_ACTION_PATH: ${{ github.action_path }}
        PR_DIFF_CONFIG: ${{ inputs.config }}
        PR_DIFF_FORMAT: ${{ inputs.format }}
        PR_DIFF_IMAGE_TOKEN: ${{ inputs.image-token }}
      with:
        script: |
          const { join } = await import('node:path')
          const { pathToFileURL } = await import('node:url')
          const entry = pathToFileURL(join(process.env.PR_DIFF_ACTION_PATH, 'src/action.mjs'))
          const { updateComment } = await import(entry.href)
          await updateComment({
            github, context, core,
            config: process.env.PR_DIFF_CONFIG,
            format: process.env.PR_DIFF_FORMAT,
            imageToken: process.env.PR_DIFF_IMAGE_TOKEN,
          })
